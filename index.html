<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- =========================================================
       REUSABLE SETTINGS — EDIT THESE VALUES FOR EACH CUSTOMER
       ========================================================= -->
  <title>Daktela chatbot demo — COMPANY_NAME</title>

  <style>
    :root {
      --daktela-blue: #0b3f73;
      --daktela-light-blue: #61b9e9;
      --daktela-red: #ff5752;
      --panel-bg: rgba(255, 255, 255, 0.94);
      --text: #17324a;
      --shadow: 0 14px 40px rgba(7, 38, 67, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden; /* Prevents scrolling */
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #e8eef3;
    }

    .website-preview {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      user-select: none;
      pointer-events: none;
    }

    /* Slight overlay makes the demo controls readable over any screenshot. */
    .page-overlay {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(3, 23, 41, 0.12) 0%,
          rgba(3, 23, 41, 0.00) 28%,
          rgba(3, 23, 41, 0.03) 100%
        );
      pointer-events: none;
    }

    .demo-header {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 1000;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 18px;
      background: var(--panel-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 18px;
    }

    .brand img {
      width: 152px;
      max-height: 48px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy h1 {
      margin: 0;
      font-size: clamp(17px, 2vw, 24px);
      line-height: 1.15;
      color: var(--daktela-blue);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-copy p {
      margin: 5px 0 0;
      font-size: 13px;
      color: #60788d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      background: #fff1f0;
      color: #a52f2b;
      border: 1px solid #ffd1ce;
      font-size: 13px;
      font-weight: 700;
    }

    .demo-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--daktela-red);
      box-shadow: 0 0 0 4px rgba(255, 87, 82, 0.14);
    }

    .language-switch {
      display: inline-flex;
      padding: 4px;
      border-radius: 12px;
      background: #eaf1f7;
      border: 1px solid #d5e0e9;
    }

    .language-switch button {
      width: 42px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #587085;
      font-weight: 800;
      cursor: pointer;
    }

    .language-switch button.active {
      color: #fff;
      background: var(--daktela-blue);
      box-shadow: 0 4px 10px rgba(11, 63, 115, 0.22);
    }

    .demo-notice {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 1000;
      max-width: min(620px, calc(100vw - 40px));
      padding: 12px 16px;
      border-radius: 14px;
      color: #354f65;
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 13px;
      line-height: 1.45;
    }

    .demo-notice strong {
      color: var(--daktela-blue);
    }

    @media (max-width: 760px) {
      .demo-header {
        top: 10px;
        left: 10px;
        right: 10px;
        padding: 10px 12px;
        gap: 10px;
      }

      .brand img {
        width: 105px;
      }

      .brand-copy p,
      .demo-badge {
        display: none;
      }

      .brand-copy h1 {
        font-size: 15px;
      }

      .demo-notice {
        left: 10px;
        bottom: 10px;
        max-width: calc(100vw - 20px);
        padding: 10px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <!-- =========================================================
       1) REPLACE THE IMAGE BELOW WITH THE CUSTOMER'S SCREENSHOT.
          Example: src="company-screenshot.jpg"
          Keep the screenshot file in the same GitHub repository.
       ========================================================= -->
  <img
    class="website-preview"
    src="screenshot-placeholder.svg"
    alt="Customer website preview"
  />

  <div class="page-overlay"></div>

  <header class="demo-header">
    <div class="brand">
      <img src="daktela-logo.png" alt="Daktela" />

      <div class="brand-copy">
        <!-- =====================================================
             2) REPLACE COMPANY_NAME WITH THE CUSTOMER'S NAME.
             ===================================================== -->
        <h1 id="pageTitle">Daktela chatbot demo — COMPANY_NAME</h1>
        <p id="pageSubtitle">Test the chatbot in a simulated website environment.</p>
      </div>
    </div>

    <div class="header-actions">
      <div class="demo-badge" id="demoBadge">DEMO ONLY</div>

      <div class="language-switch" aria-label="Language">
        <button type="button" id="skButton" class="active" onclick="setLanguage('sk')">SK</button>
        <button type="button" id="enButton" onclick="setLanguage('en')">EN</button>
      </div>
    </div>
  </header>

  <aside class="demo-notice" id="demoNotice">
    <strong>Upozornenie:</strong>
    Toto je iba demo prostredie. Zobrazená stránka je statická snímka a nejde o skutočný web.
    Interaktívny je iba chatbot.
  </aside>

  <script>
    /* ===========================================================
       3) DAKTELA CHATBOT CONFIGURATION
          Replace both values when reusing the page.
       =========================================================== */
    window.daktelaAiChatConfig = {
      url: "https://mstano-demo.bot.coworkers.ai",
      daktelaAiChatId: "26519a6f-60b5-4307-80a3-dae8b841d623",
    };

    (function () {
      var config = window.daktelaAiChatConfig;

      if (!window.daktelaAiChat || !window.daktelaAiChat.__isProxy) {
        var queue = [];

        window.daktelaAiChat = new Proxy(
          { queue: queue, __isProxy: true },
          {
            get: function (target, property) {
              return property in target
                ? target[property]
                : function () {
                    queue.push({
                      m: property,
                      a: Array.prototype.slice.call(arguments),
                      t: Date.now(),
                    });
                  };
            },
          }
        );
      }

      var loader = document.createElement("script");
      loader.defer = true;
      loader.crossOrigin = "anonymous";
      loader.src =
        config.url.replace(/\/+$/, "") +
        "/chat-window-public-api/loader/dai-loader.js";

      document.head.appendChild(loader);
    })();

    /* ===========================================================
       LANGUAGE SWITCH
       You only need to change COMPANY_NAME in the titles below.
       =========================================================== */
    const translations = {
      sk: {
        title: "Daktela chatbot demo — COMPANY_NAME",
        subtitle: "Otestujte chatbot v simulovanom prostredí webovej stránky.",
        badge: "IBA DEMO",
        notice:
          "<strong>Upozornenie:</strong> Toto je iba demo prostredie. Zobrazená stránka je statická snímka a nejde o skutočný web. Interaktívny je iba chatbot.",
      },
      en: {
        title: "Daktela chatbot demo — COMPANY_NAME",
        subtitle: "Test the chatbot in a simulated website environment.",
        badge: "DEMO ONLY",
        notice:
          "<strong>Notice:</strong> This is a demo environment only. The displayed page is a static screenshot and not a real website. Only the chatbot is interactive.",
      },
    };

    function setLanguage(language) {
      const text = translations[language];

      document.documentElement.lang = language;
      document.title = text.title;
      document.getElementById("pageTitle").textContent = text.title;
      document.getElementById("pageSubtitle").textContent = text.subtitle;
      document.getElementById("demoBadge").textContent = text.badge;
      document.getElementById("demoNotice").innerHTML = text.notice;

      document.getElementById("skButton").classList.toggle("active", language === "sk");
      document.getElementById("enButton").classList.toggle("active", language === "en");
    }

    setLanguage("sk");
  </script>
</body>
</html>
